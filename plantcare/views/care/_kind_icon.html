{% comment %}
  Icon for a care task kind. Usage:
  {% include "care/_kind_icon.html" with kind=task.kind size=12 color="var(--info)" %}
{% endcomment %}
{% if kind == "water" %}<svg width="{{ size|default:16 }}" height="{{ size|default:16 }}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10Z" stroke="{{ color|default:'currentColor' }}" stroke-width="1.8"/></svg>{% elif kind == "fertilize" %}<svg width="{{ size|default:16 }}" height="{{ size|default:16 }}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="{{ color|default:'currentColor' }}" stroke-width="1.8"/><circle cx="12" cy="12" r="8" stroke="{{ color|default:'currentColor' }}" stroke-width="1.8"/></svg>{% else %}<svg width="{{ size|default:16 }}" height="{{ size|default:16 }}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="6" cy="7" r="3" stroke="{{ color|default:'currentColor' }}" stroke-width="1.8"/><circle cx="6" cy="17" r="3" stroke="{{ color|default:'currentColor' }}" stroke-width="1.8"/><path d="M8.5 8.5 20 18M8.5 15.5 20 6" stroke="{{ color|default:'currentColor' }}" stroke-width="1.8" stroke-linecap="round"/></svg>{% endif %}
