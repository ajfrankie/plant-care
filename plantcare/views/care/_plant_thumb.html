{% comment %}Square plant photo, or its initial. Expects: plant, size.{% endcomment %}
{% if plant.image %}
<img src="{{ plant.image.url }}" alt="" loading="lazy" style="width:{{ size }}px; height:{{ size }}px; border-radius:8px; object-fit:cover; flex:none; display:block;">
{% else %}
<div style="width:{{ size }}px; height:{{ size }}px; border-radius:8px; background:var(--pale-sage); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:600; flex:none;">{{ plant.name|first|upper }}</div>
{% endif %}
