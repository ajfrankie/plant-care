<aside class="sidebar">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 4C11 4 4 11 4 20c9 0 16-7 16-16Z" fill="#DCE8D8"/></svg>
    <span>Plant Care</span>
  </div>
  <nav style="display:flex; flex-direction:column; gap:2px;">
    <a class="side-link{% if current == 'dashboard' %} active{% endif %}" data-nav="dashboard" href="{% url 'dashboard' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>Dashboard</a>
    <a class="side-link{% if current == 'my-plants' %} active{% endif %}" data-nav="my-plants" href="{% url 'my_plants' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10Z" stroke="currentColor" stroke-width="1.6"/></svg>My Plants</a>
    <a class="side-link{% if current == 'library' %} active{% endif %}" data-nav="library" href="{% url 'library' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/></svg>Plant Library</a>
    <a class="side-link{% if current == 'species' %} active{% endif %}" data-nav="species" href="{% url 'species' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 4C11 4 4 11 4 20c9 0 16-7 16-16Z" stroke="currentColor" stroke-width="1.6"/><path d="M4 20l8-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Species</a>
    <a class="side-link{% if current == 'care-schedule' %} active{% endif %}" data-nav="care-schedule" href="{% url 'care_schedule' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Care Schedule</a>
    <a class="side-link{% if current == 'watering' %} active{% endif %}" data-nav="watering" href="{% url 'watering_schedule' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z" stroke="currentColor" stroke-width="1.6"/><path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="1.6"/></svg>Watering Reminders</a>
    <a class="side-link{% if current == 'health' %} active{% endif %}" data-nav="health" href="{% url 'plant_health' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-7-10.5A5 5 0 0 1 12 6a5 5 0 0 1 7 4.5C19 16.5 12 21 12 21 Z" stroke="currentColor" stroke-width="1.6"/></svg>Plant Health</a>
    <a class="side-link{% if current == 'history' %} active{% endif %}" data-nav="history" href="{% url 'care_history' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Care History</a>
    <a class="side-link{% if current == 'notifications' %} active{% endif %}" data-nav="notifications" href="{% url 'notifications' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z" stroke="currentColor" stroke-width="1.6"/><path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="1.6"/></svg>Notifications</a>
    <div class="side-divider"></div>
    <a class="side-link{% if current == 'settings' %} active{% endif %}" data-nav="settings" href="{% url 'settings' %}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19 12a7 7 0 0 0-.1-1.1l2-1.5-2-3.4-2.3.9a7 7 0 0 0-1.9-1.1L14.3 3H9.7l-.4 2.8a7 7 0 0 0-1.9 1.1l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .7.1 1.1l-2 1.5 2 3.4 2.3-.9c.6.5 1.2.8 1.9 1.1l.4 2.8h4.6l.4-2.8c.7-.3 1.3-.6 1.9-1.1l2.3.9 2-3.4-2-1.5c.1-.4.1-.7.1-1.1Z" stroke="currentColor" stroke-width="1.4"/></svg>Settings</a>
    <a class="side-link{% if current == 'help' %} active{% endif %}" data-nav="help" href="#help"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .8-1 1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="17" r="0.9" fill="currentColor"/></svg>Help &amp; Support</a>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="side-link{% if current == 'signout' %} active{% endif %}" data-nav="signout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Sign Out</button>
    </form>
  </nav>
</aside>
