{% comment %}Icon for a notification. Expects: icon (water/fertilize/prune/health/overdue/done), color, size.{% endcomment %}
{% if icon == "overdue" %}<svg width="{{ size|default:20 }}" height="{{ size|default:20 }}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="{{ color }}" stroke-width="1.8"/><path d="M12 8v4m0 4h.01" stroke="{{ color }}" stroke-width="1.8" stroke-linecap="round"/></svg>{% elif icon == "done" %}<svg width="{{ size|default:20 }}" height="{{ size|default:20 }}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12l4.5 4.5L19 7" stroke="{{ color }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>{% else %}{% include "care/_kind_icon.html" with kind=icon size=size|default:20 color=color %}{% endif %}
