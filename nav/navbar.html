<script>
// Fix navbar links to work from any location
(function() {
  var currentPath = window.location.pathname;
  var links = document.querySelectorAll('header a[href^="/"]');
  
  // Determine the base path (how many levels to go up)
  var pathParts = currentPath.split('/').filter(function(p) { return p; });
  var depth = pathParts.length - 1; // -1 for the filename
  
  // If we're in the root or frontend folder, adjust accordingly
  if (currentPath.includes('/frontend/')) {
    // We're in frontend folder, so links starting with /frontend/ are relative
    links.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href.startsWith('/frontend/')) {
        link.setAttribute('href', href.replace('/frontend/', ''));
      } else if (href.startsWith('/pages/')) {
        link.setAttribute('href', href.replace('/pages/', '../pages/'));
      }
    });
  }
})();
</script>
