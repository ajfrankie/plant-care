<script>
// Fix sidebar links to work from any folder depth
(function() {
  const currentPath = window.location.pathname;
  const links = document.querySelectorAll('.sidebar a[href^="/pages/"]');
  
  // Determine how many levels deep we are from the pages folder
  const pathParts = currentPath.split('/');
  const pagesIndex = pathParts.indexOf('pages');
  
  if (pagesIndex !== -1) {
    // Calculate folder depth from pages directory
    const folderDepth = pathParts.length - pagesIndex - 2; // -2 for pages and filename
    const relativePath = folderDepth > 0 ? '../'.repeat(folderDepth) : '';
    
    links.forEach(link => {
      const href = link.getAttribute('href');
      // Convert /pages/folder/file.html to ../folder/file.html or folder/file.html
      const newHref = href.replace('/pages/', relativePath);
      link.setAttribute('href', newHref);
    });
  }
})();
</script>
