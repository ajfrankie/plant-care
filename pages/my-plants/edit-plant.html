<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant Care — Edit Plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

<div class="app-shell">

  <!-- Sidebar (shared) -->
  <div data-include="../../nav/sidebar.html" data-current="my-plants"></div>

  <div class="main-area">
    <!-- Header (shared) -->
    <div data-include="../../nav/app-header.html"
         data-title="Edit Plant"
         data-subtitle="Update plant information ✏️"
         data-search=""></div>

    <div style="padding:28px 32px; max-width:900px;">

      <!-- Breadcrumb -->
      <div style="margin-bottom:20px;">
        <a href="my-plants.html" class="nav-link" style="font-size:14px;">&larr; Back to My Plants</a>
      </div>

      <div class="card" style="padding:32px;">
        <form id="editPlantForm">
          
          <!-- Basic Information -->
          <div style="margin-bottom:32px;">
            <h3 class="t-h3" style="margin-bottom:20px;">Basic Information</h3>
            
            <div style="display:grid; gap:20px;">
              <div>
                <label class="t-label" style="display:block; margin-bottom:6px;">Plant Name *</label>
                <input type="text" class="input" value="Monstera Deliciosa" required style="width:100%;">
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Scientific Name</label>
                  <input type="text" class="input" value="Monstera deliciosa" style="width:100%;">
                </div>
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Common Name</label>
                  <input type="text" class="input" value="Swiss Cheese Plant" style="width:100%;">
                </div>
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Location *</label>
                  <select class="select" required style="width:100%;">
                    <option>Living Room</option>
                    <option>Bedroom</option>
                    <option>Kitchen</option>
                    <option>Bathroom</option>
                    <option>Balcony</option>
                    <option>Garden</option>
                    <option>Office</option>
                    <option>Other</option>
                  </select>
                </div>
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Date Acquired</label>
                  <input type="date" class="input" value="2024-01-15" style="width:100%;">
                </div>
              </div>

              <div>
                <label class="t-label" style="display:block; margin-bottom:6px;">Notes</label>
                <textarea class="input" rows="3" style="width:100%; resize:vertical;">This plant is thriving in indirect sunlight near the window.</textarea>
              </div>
            </div>
          </div>

          <!-- Care Requirements -->
          <div style="margin-bottom:32px;">
            <h3 class="t-h3" style="margin-bottom:20px;">Care Requirements</h3>
            
            <div style="display:grid; gap:20px;">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Watering Frequency *</label>
                  <select class="select" required style="width:100%;">
                    <option>Daily</option>
                    <option>Every 2-3 days</option>
                    <option selected>Weekly</option>
                    <option>Bi-weekly</option>
                    <option>Monthly</option>
                  </select>
                </div>
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Next Watering Date</label>
                  <input type="date" class="input" value="2024-11-10" style="width:100%;">
                </div>
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Light Requirements</label>
                  <select class="select" style="width:100%;">
                    <option>Full Sun</option>
                    <option>Partial Sun</option>
                    <option selected>Bright Indirect</option>
                    <option>Medium Light</option>
                    <option>Low Light</option>
                  </select>
                </div>
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Fertilizing Schedule</label>
                  <select class="select" style="width:100%;">
                    <option>Weekly</option>
                    <option>Bi-weekly</option>
                    <option selected>Monthly</option>
                    <option>Quarterly</option>
                    <option>Seasonally</option>
                  </select>
                </div>
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Temperature Range</label>
                  <input type="text" class="input" value="18-24°C" style="width:100%;">
                </div>
                <div>
                  <label class="t-label" style="display:block; margin-bottom:6px;">Humidity Level</label>
                  <select class="select" style="width:100%;">
                    <option>Low (30-40%)</option>
                    <option selected>Medium (40-60%)</option>
                    <option>High (60-80%)</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Plant Photo -->
          <div style="margin-bottom:32px;">
            <h3 class="t-h3" style="margin-bottom:20px;">Plant Photo</h3>
            <div style="display:flex; gap:20px; align-items:flex-start;">
              <div style="width:120px; height:120px; border-radius:12px; background:#4F8A52; display:flex; align-items:center; justify-content:center; flex:none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10Z" stroke="#fff" stroke-width="1.6"/></svg>
              </div>
              <div style="flex:1;">
                <div class="t-body" style="margin-bottom:8px;">Current Photo</div>
                <div class="t-small text-muted" style="margin-bottom:12px;">Upload a new photo to replace the current one</div>
                <input type="file" id="plantPhoto" accept="image/*" style="display:none;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('plantPhoto').click();">Change Photo</button>
              </div>
            </div>
          </div>

          <!-- Health Status -->
          <div style="margin-bottom:32px;">
            <h3 class="t-h3" style="margin-bottom:20px;">Health Status</h3>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;">
              <label style="display:flex; align-items:center; padding:12px; border:2px solid var(--border); border-radius:8px; cursor:pointer;">
                <input type="radio" name="health" value="healthy" checked style="margin-right:10px;">
                <span class="badge badge-success"><span class="badge-dot"></span>Healthy</span>
              </label>
              <label style="display:flex; align-items:center; padding:12px; border:2px solid var(--border); border-radius:8px; cursor:pointer;">
                <input type="radio" name="health" value="attention" style="margin-right:10px;">
                <span class="badge badge-warning"><span class="badge-dot"></span>Needs Attention</span>
              </label>
              <label style="display:flex; align-items:center; padding:12px; border:2px solid var(--border); border-radius:8px; cursor:pointer;">
                <input type="radio" name="health" value="critical" style="margin-right:10px;">
                <span class="badge badge-error"><span class="badge-dot"></span>Critical</span>
              </label>
            </div>
          </div>

          <!-- Action Buttons -->
          <div style="display:flex; gap:12px; justify-content:space-between; padding-top:20px; border-top:1px solid var(--border);">
            <button type="button" class="btn btn-error" onclick="if(confirm('Are you sure you want to delete this plant?')) { alert('Plant deleted!'); window.location.href='my-plants.html'; }">Delete Plant</button>
            <div style="display:flex; gap:12px;">
              <a href="my-plants.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<script src="../../assets/js/include.js"></script>
<script src="../../assets/js/script.js"></script>
<script>
document.getElementById('editPlantForm').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Plant updated successfully!');
  window.location.href = 'my-plants.html';
});
</script>
</body>
</html>
